# Builds installers for Windows and Linux and attaches them to a *draft* GitHub release.
# Trigger: push a tag like `v0.1.0`, or run it manually from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: msi,nsis
          # Oldest supported Ubuntu = widest glibc compatibility for the AppImage/deb/rpm.
          - platform: ubuntu-22.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential curl wget file patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm packages
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "ASB Image Morphosis v__VERSION__"
          releaseBody: |
            Download the file for your system:
            - **Windows:** the `.msi` or `-setup.exe` installer
            - **Linux:** the `.AppImage` (any distro, just make it executable), `.deb` (Debian/Ubuntu/Mint) or `.rpm` (Fedora/openSUSE)
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
